apiVersion: v1
kind: ServiceAccount
metadata:
  name: hello-world
  namespace: lab-workloads
  labels:
    app.kubernetes.io/name: hello-world
  annotations:
    # Set to the value of: terraform output -raw workload_identity_client_id
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-content
  namespace: lab-workloads
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location / {
        root /usr/share/nginx/html;
        index index.html;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
  index.html: |
    <!doctype html>
    <html lang="pt-BR">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hello World no AKS</title>
      </head>
      <body>
        <h1>Hello World!</h1>
        <p>Aplicação executando no Azure Kubernetes Service.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: lab-workloads
  labels:
    app.kubernetes.io/name: hello-world
    app.kubernetes.io/part-of: azure-kubernetes-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world
        app.kubernetes.io/part-of: azure-kubernetes-lab
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: hello-world
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hello-world
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: hello-world-content
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: lab-workloads
  labels:
    app.kubernetes.io/name: hello-world
  annotations:
    # Resource group that holds the static public IP (terraform output -raw lb_resource_group).
    service.beta.kubernetes.io/azure-load-balancer-resource-group: rg-kubernetes-lab
    # Static public IP address (terraform output -raw lb_public_ip). Replace before applying.
    service.beta.kubernetes.io/azure-load-balancer-ipv4: 203.0.113.10
    # Optional public DNS label, exposing <label>.<region>.cloudapp.azure.com.
    service.beta.kubernetes.io/azure-dns-label-name: kubernetes-lab-hello
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: hello-world
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
